name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l src examples cmd)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  opus:
    name: WebRTC with Opus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libopusfile-dev pkg-config
      - name: Build
        run: go build -tags opus ./...
      - name: Vet
        run: go vet -tags opus ./src/transports/webrtc/...
      - name: Test
        run: go test -race -count=1 -tags opus ./src/transports/webrtc/...

  worker:
    name: onnx-worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ci-cargo-${{ hashFiles('onnx-worker/Cargo.lock') }}
          restore-keys: ci-cargo-
      - name: Build with the committed lock file
        working-directory: onnx-worker
        run: cargo build --locked
